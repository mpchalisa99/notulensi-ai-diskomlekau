<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
  </defs>

  <!-- Deep Navy-Slate Background (#0B1120) -->
  <rect width="512" height="512" fill="#0B1120" />

  <!-- Outer Golden Tactical Shield (within 70% safe zone) -->
  <path
    d="M256 96 L388 142 C388 264 342 356 256 414 C170 356 124 264 124 142 Z"
    fill="#0B1120"
    stroke="url(#goldOuter)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Middle Golden Tactical Shield Rim -->
  <path
    d="M256 118 L366 156 C366 258 327 336 256 388 C185 336 146 258 146 156 Z"
    fill="url(#shieldCore)"
    stroke="url(#goldBright)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Inner Tactical Shield Border -->
  <path
    d="M256 140 L345 171 C345 252 312 316 256 362 C200 316 167 252 167 171 Z"
    fill="none"
    stroke="#F59E0B"
    stroke-width="4"
    stroke-opacity="0.75"
    stroke-linejoin="round"
  />

  <!-- Tactical Briefing Document Inside Left of Shield -->
  <g>
    <path
      d="M214 176 H288 L254 316 H190 V200 Z"
      fill="url(#docGrad)"
      stroke="#0B1120"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <!-- Folded top-left corner -->
    <path
      d="M214 176 V200 H190 Z"
      fill="#FEF08A"
      stroke="#0B1120"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <!-- Document text lines -->
    <rect x="228" y="198" width="38" height="6" rx="3" fill="#0B1120" />
    <rect x="202" y="218" width="62" height="6" rx="3" fill="#0B1120" />
    <rect x="202" y="236" width="54" height="6" rx="3" fill="#0B1120" />
    <rect x="202" y="254" width="46" height="6" rx="3" fill="#0B1120" />
    <rect x="202" y="272" width="42" height="6" rx="3" fill="#0B1120" />
    <rect x="202" y="290" width="48" height="6" rx="3" fill="#0B1120" />
  </g>

  <!-- Korps Elektronika Lightning Bolt Cutting Across Shield -->
  <path
    d="M318 134 L362 130 L306 238 H346 L220 402 L276 276 H238 Z"
    fill="url(#goldBright)"
    stroke="#0B1120"
    stroke-width="8"
    stroke-linejoin="round"
  />
  <!-- Inner Highlight on Lightning Bolt -->
  <path
    d="M322 142 L350 139 L298 242 H332 L238 372 L284 270 H248 Z"
    fill="#FEF08A"
    fill-opacity="0.45"
  />
</svg>
